  <style>
/* Project Review — mobile-first styles */
* { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --navy: #1d3557;
  --navy-2: #2b4a75;
  --accent: #e63946;
  --bg: #f0f2f5;
  --card: #ffffff;
  --ink: #16212e;
  --muted: #6b7a89;
  --line: #d9e0e7;
  --green: #2a9d8f;
  --amber: #e9a13b;
}

html { -webkit-text-size-adjust: 100%; }
body {
  font: 16px/1.45 -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  background: var(--bg);
  color: var(--ink);
  min-height: 100vh;
}

.hidden { display: none !important; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.center { text-align: center; }

/* ---------- header ---------- */
.app-header {
  position: sticky; top: 0; z-index: 20;
  display: flex; align-items: center; gap: 8px;
  background: var(--navy); color: #fff;
  padding: calc(env(safe-area-inset-top, 0px) + 12px) 14px 12px;
}
.app-header h1 {
  flex: 1; font-size: 18px; font-weight: 600;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.icon-btn {
  font: inherit; font-size: 18px; line-height: 1;
  background: none; border: 0; color: inherit; cursor: pointer;
  padding: 6px 8px; border-radius: 8px;
}
.app-header .icon-btn:active { background: rgba(255, 255, 255, 0.15); }

/* ---------- layout ---------- */
.view {
  max-width: 760px; margin: 0 auto;
  padding: 14px 14px calc(env(safe-area-inset-bottom, 0px) + 40px);
}

.card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 14px;
  margin-bottom: 12px;
}
.card-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }

.section-label {
  font-size: 13px; text-transform: uppercase; letter-spacing: 0.06em;
  color: var(--muted); margin: 18px 2px 8px;
}

.empty {
  text-align: center; color: var(--muted);
  padding: 30px 10px; background: var(--card);
  border: 1px dashed var(--line); border-radius: 12px; margin-bottom: 12px;
}

/* ---------- buttons ---------- */
.btn {
  font: inherit; font-size: 15px; font-weight: 600;
  background: #fff; color: var(--navy);
  border: 1px solid var(--line); border-radius: 10px;
  padding: 11px 16px; cursor: pointer;
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
}
.btn:active { transform: scale(0.99); }
.btn.primary { background: var(--navy); border-color: var(--navy); color: #fff; }
.btn.danger { background: #fff; border-color: #e5b4b8; color: var(--accent); }
.btn.small { padding: 7px 12px; font-size: 13.5px; border-radius: 8px; }
.btn.block { display: flex; width: 100%; margin-bottom: 10px; }
.btn:disabled { opacity: 0.6; cursor: default; }

.mic-btn.recording {
  background: var(--accent); border-color: var(--accent); color: #fff;
  animation: pulse 1.4s infinite;
}
@keyframes pulse {
  0%, 100% { box-shadow: 0 0 0 0 rgba(230, 57, 70, 0.35); }
  50% { box-shadow: 0 0 0 8px rgba(230, 57, 70, 0); }
}

/* ---------- toolbar / chips ---------- */
.toolbar { margin-bottom: 12px; }
.toolbar input[type="search"] {
  width: 100%; font: inherit; padding: 11px 14px;
  border: 1px solid var(--line); border-radius: 10px; background: #fff;
  margin-bottom: 8px;
}
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip {
  font: inherit; font-size: 13px; font-weight: 600;
  padding: 6px 12px; border-radius: 999px;
  border: 1px solid var(--line); background: #fff; color: var(--muted);
  cursor: pointer;
}
.chip.active { background: var(--navy); border-color: var(--navy); color: #fff; }

/* ---------- home tabs (Projects / Saved reviews) ---------- */
.tabs {
  display: flex; gap: 4px; padding: 4px;
  background: #e3e8ee; border-radius: 12px; margin-bottom: 14px;
}
.tab {
  flex: 1; text-align: center; text-decoration: none;
  font-size: 14.5px; font-weight: 650; color: var(--muted);
  padding: 9px 8px; border-radius: 9px;
}
.tab.active { background: #fff; color: var(--navy); box-shadow: 0 1px 3px rgba(22, 33, 46, 0.12); }

/* ---------- list rows ---------- */
.list { margin-bottom: 4px; }
.row-card {
  display: flex; gap: 10px; align-items: center;
  text-decoration: none; color: inherit;
}
.row-card:active { background: #f7f9fb; }
.row-main { flex: 1; min-width: 0; }
.row-title { font-weight: 650; margin-bottom: 1px; }
.row-sub { font-size: 13.5px; color: #43556a; }
.row-side { display: flex; flex-direction: column; align-items: flex-end; gap: 5px; }
.chev { color: var(--muted); font-size: 22px; }

.pill {
  font-size: 11.5px; font-weight: 700; letter-spacing: 0.03em;
  padding: 3px 9px; border-radius: 999px; white-space: nowrap;
}
.pill-active { background: #e3f3f1; color: var(--green); }
.pill-onhold { background: #fbf0dd; color: #a86d14; }
.pill-complete { background: #e7ebf1; color: #4b5c72; }

.kv { display: flex; gap: 10px; padding: 4px 0; font-size: 14.5px; }
.kv span { color: var(--muted); min-width: 92px; }
.kv strong { font-weight: 500; }

/* ---------- forms ---------- */
.form label { display: block; font-size: 13.5px; font-weight: 600; color: #33465c; margin-bottom: 12px; }
.form input:not([type="checkbox"]), .form select, .form textarea {
  display: block; width: 100%; font: inherit; font-size: 16px;
  margin-top: 4px; padding: 10px 12px;
  border: 1px solid var(--line); border-radius: 9px; background: #fff;
}
.form input:focus, .form select:focus, .form textarea:focus,
.sec-title:focus, .sec-notes:focus {
  outline: 2px solid var(--navy-2); outline-offset: 0;
}
.form .check { display: flex; align-items: center; gap: 8px; font-size: 15px; }
.form .check input { width: 20px; height: 20px; }
.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0 12px; }
.settings-sub { font-size: 15px; margin: 6px 0 6px; color: var(--navy); }
.app-link {
  display: block; word-break: break-all;
  font-size: 14px; color: var(--navy-2); font-weight: 600;
  padding: 10px 12px; margin-bottom: 10px;
  background: #f1f4f7; border: 1px solid var(--line); border-radius: 9px;
  text-decoration: none;
}
.link-actions { display: flex; gap: 8px; }
.link-actions .btn { flex: 1; text-decoration: none; }

.form .field { margin-bottom: 12px; }
.form .field-label { display: block; font-size: 13.5px; font-weight: 600; color: #33465c; margin-bottom: 6px; }
.chip-list { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; min-height: 26px; }
.reviewer-chip {
  display: inline-flex; align-items: center; gap: 7px;
  background: var(--navy); border-color: var(--navy); color: #fff;
  cursor: default;
}
.chip-remove {
  display: inline-flex; align-items: center; justify-content: center;
  width: 17px; height: 17px; border-radius: 50%; padding: 0;
  border: 0; background: rgba(255, 255, 255, 0.25); color: #fff;
  font-size: 10px; line-height: 1; cursor: pointer;
}

/* ---------- review sections ---------- */
.section-head { display: flex; align-items: center; gap: 2px; margin-bottom: 8px; }
.sec-title {
  flex: 1; font: inherit; font-size: 16px; font-weight: 650;
  border: 0; border-bottom: 2px solid var(--line);
  padding: 6px 2px; background: transparent; min-width: 0;
}
.section-head .icon-btn { color: var(--muted); font-size: 15px; }
.sec-notes {
  width: 100%; font: inherit; font-size: 15px;
  border: 1px solid var(--line); border-radius: 9px;
  padding: 10px 12px; resize: vertical; min-height: 90px;
}
.dict-bar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin: 8px 0 10px; }
.interim { font-style: italic; flex: 1; min-width: 120px; }

.photo-row { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
.photo-thumb { position: relative; width: 132px; }
.photo-thumb img {
  width: 132px; height: 100px; object-fit: cover;
  border-radius: 8px; border: 1px solid var(--line); display: block;
}
.photo-thumb .thumb-btns {
  position: absolute; top: 4px; right: 4px; display: flex; gap: 4px;
}
.photo-thumb .thumb-btns button {
  width: 24px; height: 24px; border-radius: 50%;
  border: 0; background: rgba(22, 33, 46, 0.75); color: #fff;
  font-size: 12px; cursor: pointer; line-height: 1;
  display: flex; align-items: center; justify-content: center;
}
.photo-thumb .thumb-edit { background: rgba(29, 53, 87, 0.85); }
.photo-caption {
  width: 100%; font: inherit; font-size: 12px;
  border: 0; border-bottom: 1px solid var(--line);
  padding: 4px 2px; margin-top: 2px; background: transparent;
}
.photo-add { margin-bottom: 4px; }
.photo-add input { display: none; }

.actions { margin-top: 18px; }

/* ---------- read-only review preview ---------- */
.preview-actions {
  display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px;
}
.preview-actions .btn { flex: 1; min-width: 130px; }
.preview-frame {
  background: #fff; border: 1px solid var(--line); border-radius: 12px;
  overflow: hidden;
}
.preview-frame iframe {
  display: block; width: 100%; border: 0; min-height: 60vh;
}

/* ---------- toast ---------- */
.toast {
  position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 24px);
  transform: translateX(-50%);
  background: var(--ink); color: #fff;
  font-size: 14px; padding: 10px 18px; border-radius: 999px;
  box-shadow: 0 4px 16px rgba(0, 0, 0, 0.25);
  z-index: 50; max-width: 90vw; text-align: center;
}

@media (min-width: 700px) {
  .view { padding-top: 20px; }
  .photo-thumb { width: 160px; }
  .photo-thumb img { width: 160px; height: 120px; }
}

/* ---------- photo annotation editor ---------- */
.pe-overlay {
  position: fixed; inset: 0; z-index: 100;
  background: #10151c; color: #fff;
  display: flex; flex-direction: column;
}
.pe-toolbar {
  display: flex; align-items: center; gap: 10px;
  padding: calc(env(safe-area-inset-top, 0px) + 10px) 12px 10px;
  background: #1d2530;
}
.pe-toolbar.pe-bottom {
  padding: 10px 12px calc(env(safe-area-inset-bottom, 0px) + 10px);
  justify-content: space-between; flex-wrap: wrap;
}
.pe-top .pe-title { flex: 1; text-align: center; font-weight: 600; }
.pe-btn {
  font: inherit; font-size: 14px; font-weight: 600;
  background: #2c3947; color: #fff; border: 0; border-radius: 8px;
  padding: 9px 14px; cursor: pointer;
}
.pe-btn.pe-primary { background: var(--accent); }
.pe-stage {
  flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center;

}
.pe-canvas { touch-action: none; background: #000; border-radius: 4px; }
.pe-tools { display: flex; gap: 6px; }
.pe-tool {

}

}

  <script>
/* IndexedDB wrapper — all app data lives on the device. */
const DB = (() => {
  const NAME = 'project-review-db';
  const VERSION = 1;
  let dbPromise = null;

  function open() {
    if (dbPromise) return dbPromise;
    dbPromise = new Promise((resolve, reject) => {
      const req = indexedDB.open(NAME, VERSION);
      req.onupgradeneeded = () => {
        const db = req.result;
        if (!db.objectStoreNames.contains('projects')) {
          db.createObjectStore('projects', { keyPath: 'id' });
        }
        if (!db.objectStoreNames.contains('reviews')) {
          const s = db.createObjectStore('reviews', { keyPath: 'id' });
          s.createIndex('projectId', 'projectId', { unique: false });
        }
        if (!db.objectStoreNames.contains('photos')) {
          db.createObjectStore('photos', { keyPath: 'id' });
        }
        if (!db.objectStoreNames.contains('settings')) {
          db.createObjectStore('settings', { keyPath: 'key' });
        }
      };
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
    return dbPromise;
  }

  function reqToPromise(req) {
    return new Promise((resolve, reject) => {
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
  }

  async function store(name, mode) {
    const db = await open();
    return db.transaction(name, mode).objectStore(name);
  }

  return {
    async put(name, value) {
      return reqToPromise((await store(name, 'readwrite')).put(value));
    },
    async get(name, key) {
      return reqToPromise((await store(name, 'readonly')).get(key));
    },
    async getAll(name) {
      return reqToPromise((await store(name, 'readonly')).getAll());
    },
    async delete(name, key) {
      return reqToPromise((await store(name, 'readwrite')).delete(key));
    },
    async byIndex(name, indexName, value) {
      const s = await store(name, 'readonly');
      return reqToPromise(s.index(indexName).getAll(value));
    },

    /* App settings stored under a single record. */
    async getSettings() {
      const rec = await this.get('settings', 'app');
      return Object.assign(
        {
          reviewer: '',
          company: '',
          aiEnabled: false,
          apiKey: '',
          people: ['Fred Marsh', 'Matt Newitt', 'Alex Clarke', 'Anya Drake'],
        },
        rec ? rec.value : {}
      );
    },
    async saveSettings(value) {
      return this.put('settings', { key: 'app', value });
    },
  };
})();

</script>
  <script>
/* Turns raw dictated speech into concise bullet points.
 * Two modes:
 *   Tidy.local(text)        — instant, offline, rule-based cleanup.
 *   Tidy.ai(text, apiKey)   — Claude-powered cleanup (optional, set up in Settings).
 * Both return an array of bullet strings.
 */
const Tidy = (() => {

  // Spoken punctuation / structure commands.
  const COMMANDS = [
    [/\b(full stop|period)\b/gi, '.'],
    [/\bcomma\b/gi, ','],
    [/\b(new line|newline|new point|next point|new bullet|bullet point)\b/gi, '\n'],
  ];

  // Filler words that are safe to strip from dictation.
  const FILLERS = /\b(um+|uh+|erm+|err?|ah+|hmm+|you know|i mean|basically|kind of like|sort of like)\b/gi;

  // Leading conversational lead-ins to drop from the start of a point.
  const LEAD_INS = /^(and|so|then|also|ok(ay)?|right|well|next)\b[\s,]*/i;

  const BULLET = '• ';

  function cleanPoint(raw) {
    let t = raw
      .replace(FILLERS, ' ')
      .replace(/\s+([.,;:!?])/g, '$1')
      .replace(/\s{2,}/g, ' ')
      .trim();
    t = t.replace(/^[-•*]+\s*/, ''); // drop any existing bullet marker (re-tidy)
    t = t.replace(LEAD_INS, '');
    t = t.replace(/[.,;:\s]+$/g, '');
    if (!t) return '';
    return t.charAt(0).toUpperCase() + t.slice(1);
  }

  function local(text) {
    let t = ' ' + String(text || '') + ' ';
    for (const [re, rep] of COMMANDS) t = t.replace(re, rep);

    const points = [];
    for (const chunk of t.split(/\n+/)) {
      for (const sentence of chunk.split(/(?<=[.!?])\s+/)) {
        const p = cleanPoint(sentence);
        if (p.length > 1 && p !== points[points.length - 1]) points.push(p);
      }
    }
    return points.map((p) => BULLET + p);
  }

  const SYSTEM_PROMPT = [
    'You clean up dictated project-review notes.',
    'Rewrite the raw dictation as concise bullet points, one point per line, no bullet characters.',
    'Keep every concrete fact: measurements, quantities, locations, names, dates, defects, risks, decisions and actions.',
    'Remove filler words, repetition and conversational padding. Group closely related fragments into one point.',
    'Some lines may already be tidy bullet points — keep those, merging duplicates.',
    'Never invent information that is not in the input.',
    'Output ONLY the bullet lines, nothing else.',
  ].join(' ');

  async function ai(text, apiKey) {
    const resp = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: {
        'content-type': 'application/json',
        'x-api-key': apiKey,
        'anthropic-version': '2023-06-01',
        // Required for calling the Anthropic API directly from a browser.
        'anthropic-dangerous-direct-browser-access': 'true',
      },
      body: JSON.stringify({
        model: 'claude-opus-4-8',
        max_tokens: 2000,
        system: SYSTEM_PROMPT,
        messages: [{ role: 'user', content: String(text || '') }],
      }),
    });

    if (!resp.ok) {
      const err = await resp.json().catch(() => null);
      throw new Error((err && err.error && err.error.message) || 'API error ' + resp.status);
    }
    const data = await resp.json();
    const out = (data.content || [])
      .filter((b) => b.type === 'text')
      .map((b) => b.text)
      .join('\n');
    return out
      .split('\n')
      .map((l) => l.replace(/^[-•*]\s*/, '').trim())
      .filter(Boolean)
      .map((l) => BULLET + l);
  }

  return { local, ai };
})();

</script>
  <script>
/* Speech-to-text via the Web Speech API.
 * Best support: Chrome (Android/desktop) and Edge. iOS Safari 14.5+ has partial
 * support; on unsupported browsers the mic button is hidden and the keyboard's
 * built-in dictation still works into any text field.
 *
 * Emits a single running transcript (onTranscript) rather than one event per
 * word, so the caller can render dictation as one continuous, non-duplicated
 * stream instead of a new line per word.
 */
function createDictation(handlers) {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) return null;

  let rec = null;
  let wantActive = false;
  let committedFinal = ''; // finalized text carried across auto-restarts
  let instanceFinal = '';  // finalized text within the current recognition instance

  function build() {
    rec = new SR();
    rec.continuous = true;
    rec.interimResults = true;
    rec.lang = navigator.language || 'en-GB';
    instanceFinal = '';

    rec.onresult = (e) => {
      // Recompute the whole transcript for this instance every event — this is
      // idempotent, so a result that fires more than once can't be duplicated.
      let interim = '';
      let finalNow = '';
      for (let i = 0; i < e.results.length; i++) {
        const r = e.results[i];
        if (r.isFinal) finalNow += r[0].transcript + ' ';
        else interim += r[0].transcript + ' ';
      }
      instanceFinal = finalNow;
      handlers.onTranscript(committedFinal + instanceFinal, interim);
    };

    rec.onerror = (e) => {
      if (e.error === 'not-allowed' || e.error === 'service-not-allowed') {
        wantActive = false;
        handlers.onState(false);
        handlers.onError('Microphone access was blocked. Allow it in your browser settings.');
      }
      // 'no-speech' / 'aborted' are routine; onend handles the restart.
    };

    // Mobile browsers stop recognition after a pause — restart while active,
    // preserving everything finalized so far.
    rec.onend = () => {
      committedFinal += instanceFinal;
      instanceFinal = '';
      if (wantActive) {
        try { rec.start(); } catch (_) { /* already starting */ }
      } else {
        handlers.onState(false);
      }
    };
  }

  return {
    start() {
      wantActive = true;
      committedFinal = '';
      instanceFinal = '';
      build();
      try {
        rec.start();
        handlers.onState(true);
      } catch (_) {
        wantActive = false;
        handlers.onState(false);
      }
    },
    stop() {
      wantActive = false;
      try { rec.stop(); } catch (_) { /* not running */ }
    },
    get active() {
      return wantActive;
    },
  };
}

  <script>
/* Photo annotation editor: sketch freehand lines, straight lines and arrows
 * over a photo. Annotations are stored as vector strokes (re-editable), and a
 * flattened image is produced for display/export so the original is preserved.
 *
 *   PhotoEditor.open(blob, annotations) -> Promise<{annotations, annotatedBlob} | null>
 *   PhotoEditor.composite(blob, annotations) -> Promise<Blob>   // flatten strokes onto the image
 */
const PhotoEditor = (() => {
  const COLORS = ['#e63946', '#ffd000', '#22c55e', '#111111', '#ffffff'];

  async function loadBitmap(blob) {
    if (window.createImageBitmap) {
      try { return await createImageBitmap(blob); } catch (_) { /* fall through */ }
    }
    return await new Promise((resolve, reject) => {
      const img = new Image();
      img.onload = () => resolve(img);
      img.onerror = reject;
      img.src = URL.createObjectURL(blob);
    });
  }
  const dimsOf = (bmp) => ({ w: bmp.width || bmp.naturalWidth, h: bmp.height || bmp.naturalHeight });

  function drawArrowHead(ctx, a, b, w) {
    const ang = Math.atan2(b.y - a.y, b.x - a.x);
    const len = Math.max(12, w * 5);
    const spread = Math.PI / 7;
    ctx.beginPath();
    ctx.moveTo(b.x, b.y);
    ctx.lineTo(b.x - len * Math.cos(ang - spread), b.y - len * Math.sin(ang - spread));
    ctx.moveTo(b.x, b.y);
    ctx.lineTo(b.x - len * Math.cos(ang + spread), b.y - len * Math.sin(ang + spread));
    ctx.stroke();
  }

  function drawStroke(ctx, s) {
    const p = s.points || [];
    if (!p.length) return;
    ctx.strokeStyle = s.color;
    ctx.lineWidth = s.width;
    ctx.lineJoin = 'round';
    ctx.lineCap = 'round';
    if (s.type === 'free') {
      ctx.beginPath();
      ctx.moveTo(p[0].x, p[0].y);
      for (let i = 1; i < p.length; i++) ctx.lineTo(p[i].x, p[i].y);
      ctx.stroke();
    } else {
      const a = p[0];
      const b = p[p.length - 1];
      ctx.beginPath();
      ctx.moveTo(a.x, a.y);
      ctx.lineTo(b.x, b.y);
      ctx.stroke();
      if (s.type === 'arrow') drawArrowHead(ctx, a, b, s.width);
    }
  }

  async function compositeFromBitmap(bmp, annotations) {
    const { w, h } = dimsOf(bmp);
    const c = document.createElement('canvas');
    c.width = w;
    c.height = h;
    const ctx = c.getContext('2d');
    ctx.drawImage(bmp, 0, 0, w, h);
    for (const s of annotations || []) drawStroke(ctx, s);
    return await new Promise((r) => c.toBlob(r, 'image/jpeg', 0.85));
  }

  async function composite(blob, annotations) {
    return compositeFromBitmap(await loadBitmap(blob), annotations);
  }

  function open(blob, annotations) {
    return new Promise(async (resolve) => {
      const bmp = await loadBitmap(blob);
      const { w: iw, h: ih } = dimsOf(bmp);
      const baseWidth = Math.max(3, Math.round(Math.max(iw, ih) / 220));

      // Deep-copy incoming strokes so a Cancel leaves the original untouched.
      let strokes = (annotations || []).map((s) => ({
        type: s.type, color: s.color, width: s.width,
        points: s.points.map((pt) => ({ x: pt.x, y: pt.y })),
      }));
      let current = null;
      let tool = 'arrow';
      let color = COLORS[0];

      const overlay = document.createElement('div');
      overlay.className = 'pe-overlay';
      overlay.innerHTML = `
        <div class="pe-toolbar pe-top">
          <button class="pe-btn" data-act="cancel">Cancel</button>
          <span class="pe-title">Annotate photo</span>
          <button class="pe-btn pe-primary" data-act="save">Save</button>
        </div>
        <div class="pe-stage"><canvas class="pe-canvas"></canvas></div>
        <div class="pe-toolbar pe-bottom">
          <div class="pe-tools">
            <button class="pe-tool" data-tool="pen" title="Pen">&#9998;</button>
            <button class="pe-tool" data-tool="arrow" title="Arrow">&#8599;</button>
            <button class="pe-tool" data-tool="line" title="Line">&#8725;</button>
          </div>
          <div class="pe-colors">
            ${COLORS.map((c) => `<button class="pe-color" data-color="${c}" style="background:${c}"></button>`).join('')}
          </div>
          <div class="pe-tools">
            <button class="pe-btn" data-act="undo">Undo</button>
            <button class="pe-btn" data-act="clear">Clear</button>
          </div>
        </div>
      `;
      document.body.appendChild(overlay);
      document.body.style.overflow = 'hidden';

      const canvas = overlay.querySelector('.pe-canvas');
      const ctx = canvas.getContext('2d');
      let k = 1; // canvas pixels per image pixel

      function paintTools() {
        overlay.querySelectorAll('.pe-tool').forEach((b) =>
          b.classList.toggle('active', b.dataset.tool === tool));
        overlay.querySelectorAll('.pe-color').forEach((b) =>
          b.classList.toggle('active', b.dataset.color === color));
      }

      function redraw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.drawImage(bmp, 0, 0, canvas.width, canvas.height);
        ctx.save();
        ctx.scale(k, k);
        for (const s of strokes) drawStroke(ctx, s);
        if (current) drawStroke(ctx, current);
        ctx.restore();
      }

      function fit() {
        const stage = overlay.querySelector('.pe-stage');
        const availW = stage.clientWidth;
        const availH = stage.clientHeight;
        if (!availW || !availH) return;
        const s = Math.min(availW / iw, availH / ih);
        const cssW = Math.max(1, Math.floor(iw * s));
        const cssH = Math.max(1, Math.floor(ih * s));
        const dpr = window.devicePixelRatio || 1;
        canvas.style.width = cssW + 'px';
        canvas.style.height = cssH + 'px';
        canvas.width = Math.round(cssW * dpr);
        canvas.height = Math.round(cssH * dpr);
        k = canvas.width / iw;
        redraw();
      }

      function toImg(ev) {
        const r = canvas.getBoundingClientRect();
        return {
          x: ((ev.clientX - r.left) / r.width) * iw,
          y: ((ev.clientY - r.top) / r.height) * ih,
        };
      }

      let drawing = false;
      canvas.addEventListener('pointerdown', (ev) => {
        ev.preventDefault();
        drawing = true;
        canvas.setPointerCapture(ev.pointerId);
        const pt = toImg(ev);
        current = { type: tool === 'pen' ? 'free' : tool, color, width: baseWidth, points: [pt] };
        if (current.type !== 'free') current.points.push(pt); // start == end until moved
        redraw();
      });
      canvas.addEventListener('pointermove', (ev) => {
        if (!drawing || !current) return;
        const pt = toImg(ev);
        if (current.type === 'free') current.points.push(pt);
        else current.points[1] = pt;
        redraw();
      });
      function endStroke() {
        if (!drawing) return;
        drawing = false;
        if (current) {
          const p = current.points;
          const moved =
            current.type === 'free'
              ? p.length > 1
              : Math.hypot(p[1].x - p[0].x, p[1].y - p[0].y) > baseWidth;
          if (moved) strokes.push(current);
        }
        current = null;
        redraw();
      }
      canvas.addEventListener('pointerup', endStroke);
      canvas.addEventListener('pointercancel', endStroke);
      canvas.addEventListener('pointerleave', () => { if (drawing) endStroke(); });

      function close() {
        window.removeEventListener('resize', fit);
        overlay.remove();
        document.body.style.overflow = '';
      }

      overlay.addEventListener('click', async (ev) => {
        const tb = ev.target.closest('[data-tool]');
        if (tb) { tool = tb.dataset.tool; paintTools(); return; }
        const cb = ev.target.closest('[data-color]');
        if (cb) { color = cb.dataset.color; paintTools(); return; }
        const ab = ev.target.closest('[data-act]');
        if (!ab) return;
        const act = ab.dataset.act;
        if (act === 'undo') { strokes.pop(); redraw(); }
        else if (act === 'clear') { strokes = []; redraw(); }
        else if (act === 'cancel') { close(); resolve(null); }
        else if (act === 'save') {
          const annotatedBlob = strokes.length ? await compositeFromBitmap(bmp, strokes) : null;
          close();
          resolve({ annotations: strokes, annotatedBlob });
        }
      });

      window.addEventListener('resize', fit);
      paintTools();
      // Let layout settle so the stage has measurable dimensions.
      requestAnimationFrame(fit);
    });
  }

  return { open, composite };
})();

/* Builds the standardised review form as a self-contained HTML document.
 * Open it in a new tab to Print / Save as PDF, or download the file itself.
 */
const Exporter = (() => {
  const esc = (s) =>
    String(s ?? '').replace(/[&<>"']/g, (c) => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
    }[c]));

  const STATUS_LABELS = { active: 'Active', onhold: 'On hold', complete: 'Complete' };

  function metaRow(label, value) {
    if (!value) return '';
    return `<tr><th>${esc(label)}</th><td>${esc(value)}</td></tr>`;
  }

  /* photoUrls: Map photoId -> data URL
   * embedded: true when shown inside the app's in-page preview iframe
   *   (no print toolbar, white page background, full-width sheet). */
  function buildHtml({ project, review, settings, photoUrls, embedded }) {
    const sectionsHtml = (review.sections || [])
      .map((sec, si) => {
        const bullets = String(sec.notes || '')
          .split('\n')
          .map((l) => l.replace(/^[-•*]\s*/, '').trim())
          .filter(Boolean)
          .map((l) => `<li>${esc(l)}</li>`)
          .join('');

        const photos = (sec.photos || [])
          .map((p, pi) => {
            const url = photoUrls.get(p.id);
            if (!url) return '';
            const label = `Photo ${si + 1}.${pi + 1}`;
            const caption = p.caption ? ` — ${esc(p.caption)}` : '';
            return `<figure><img src="${url}" alt="${esc(label)}"><figcaption>${label}${caption}</figcaption></figure>`;
          })
          .join('');

        return `
        <section class="review-section">
          <h2>${si + 1}. ${esc(sec.title || 'Untitled section')}</h2>
          ${bullets ? `<ul>${bullets}</ul>` : '<p class="none">No notes recorded.</p>'}
          ${photos ? `<div class="photo-grid">${photos}</div>` : ''}
        </section>`;
      })
      .join('');

    const nextSteps = String(review.nextSteps || '')
      .split('\n')
      .map((l) => l.replace(/^[-•*]\s*/, '').trim())
      .filter(Boolean);
    const nextStepsPhotos = (review.nextStepsPhotos || [])
      .map((p, pi) => {
        const url = photoUrls.get(p.id);
        if (!url) return '';
        const label = `Photo N.${pi + 1}`;
        const caption = p.caption ? ` — ${esc(p.caption)}` : '';
        return `<figure><img src="${url}" alt="${esc(label)}"><figcaption>${label}${caption}</figcaption></figure>`;
      })
      .join('');
    const nextStepsHtml = `
      <section class="review-section next-steps">
        <h2>Next steps</h2>
        ${nextSteps.length
          ? `<ul>${nextSteps.map((s) => `<li>${esc(s)}</li>`).join('')}</ul>`
          : '<p class="none">None recorded.</p>'}
        ${nextStepsPhotos ? `<div class="photo-grid">${nextStepsPhotos}</div>` : ''}
      </section>`;

    const reviewerList = Array.isArray(review.reviewers)
      ? review.reviewers.filter(Boolean)
      : review.reviewer ? [review.reviewer] : [];

    const signoffHtml = (reviewerList.length ? reviewerList : ['reviewer'])
      .map((n) => `<div class="line">Signed (${esc(n)})</div><div class="line">Date</div>`)
      .join('');

    const generated = new Date().toLocaleString();

    return `<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Review — ${esc(project.name)} — ${esc(review.date || '')}</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font: 13px/1.5 -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
         color: #16212e; background: ${embedded ? '#fff' : '#e9ecef'}; }
  .sheet { max-width: 800px; margin: 0 auto; background: #fff;
           padding: ${embedded ? '20px 20px 28px' : '34px 40px'}; }
  .doc-header { display: flex; justify-content: space-between; align-items: flex-start;
                border-bottom: 3px solid #1d3557; padding-bottom: 12px; margin-bottom: 18px; }
  .doc-header h1 { font-size: 20px; color: #1d3557; letter-spacing: .04em; }
  .doc-header .company { font-size: 14px; font-weight: 600; text-align: right; }
  .doc-header .subtitle { color: #5a6b7d; font-size: 12px; margin-top: 2px; }
  table.meta { width: 100%; border-collapse: collapse; margin-bottom: 22px; }
  table.meta th, table.meta td { border: 1px solid #cfd8e0; padding: 6px 10px; text-align: left; }
  table.meta th { background: #f1f4f7; width: 28%; font-weight: 600; color: #33465c; }
  .review-section { margin-bottom: 20px; break-inside: avoid-page; }
  .review-section h2 { font-size: 14.5px; color: #1d3557; background: #f1f4f7;
                       border-left: 4px solid #1d3557; padding: 6px 10px; margin-bottom: 8px; }
  .review-section ul { margin: 0 0 8px 22px; }
  .review-section li { margin-bottom: 3px; }
  .none { color: #8a97a5; font-style: italic; margin-bottom: 8px; }
  .photo-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 6px; }
  .photo-grid figure { break-inside: avoid; }
  .photo-grid img { width: 100%; border: 1px solid #cfd8e0; }
  .photo-grid figcaption { font-size: 11px; color: #5a6b7d; margin-top: 3px; }
  .signoff { display: grid; grid-template-columns: 1fr 1fr; gap: 40px; margin-top: 36px; }
  .signoff .line { border-top: 1px solid #33465c; padding-top: 4px; font-size: 12px; color: #33465c; }
  .doc-footer { margin-top: 26px; font-size: 10.5px; color: #8a97a5;
                border-top: 1px solid #e1e7ec; padding-top: 6px; }
  .toolbar { position: sticky; top: 0; background: #1d3557; color: #fff; padding: 10px;
             display: flex; gap: 10px; justify-content: center; }
  .toolbar button { font: inherit; padding: 8px 18px; border: 0; border-radius: 6px;
                    background: #e63946; color: #fff; cursor: pointer; }
  @media print {
    body { background: #fff; }
    .toolbar { display: none; }
    .sheet { max-width: none; padding: 0; }
    @page { margin: 18mm 15mm; }
  }
</style>
</head>
<body>
${embedded ? '' : '<div class="toolbar"><button onclick="window.print()">Print / Save as PDF</button></div>'}
<div class="sheet">
  <div class="doc-header">
    <div>
      <h1>PROJECT REVIEW REPORT</h1>
      <div class="subtitle">${esc(review.title || 'Review')}</div>
    </div>
    <div class="company">${esc(settings.company || '')}</div>
  </div>

  <table class="meta">
    ${metaRow('Project', project.name)}
    ${metaRow('Project aspect', project.aspect)}
    ${metaRow('Reference', project.ref)}
    ${metaRow('CAD name', project.cadName)}
    ${metaRow('CAD version', project.cadVersion)}
    ${metaRow('Location', project.location)}
    ${metaRow('Project status', STATUS_LABELS[project.status] || project.status)}
    ${metaRow('Review date', review.date)}
    ${metaRow('Reviewed by', reviewerList.join(', '))}
  </table>

  ${sectionsHtml || '<p class="none">No review sections.</p>'}

  ${nextStepsHtml}

  <div class="signoff">
    ${signoffHtml}
  </div>

  <div class="doc-footer">Generated ${esc(generated)} · Project Review app</div>
</div>
</body>
</html>`;
  }

  function blobToDataUrl(blob) {
    return new Promise((resolve, reject) => {
      const r = new FileReader();
      r.onload = () => resolve(r.result);
      r.onerror = () => reject(r.error);
      r.readAsDataURL(blob);
    });
  }

  async function collectPhotoUrls(review) {
    const urls = new Map();
    const refs = [];
    for (const sec of review.sections || []) for (const p of sec.photos || []) refs.push(p);
    for (const p of review.nextStepsPhotos || []) refs.push(p);
    for (const p of refs) {
      const rec = await DB.get('photos', p.id);
      // Prefer the flattened annotated image so sketches show on the form.
      const blob = rec && (rec.annotatedBlob || rec.blob);
      if (blob) urls.set(p.id, await blobToDataUrl(blob));
    }
    return urls;
  }

  async function makeDocument(project, review, settings, opts) {
    const photoUrls = await collectPhotoUrls(review);
    return buildHtml({ project, review, settings, photoUrls, embedded: !!(opts && opts.embedded) });
  }

  function filename(project, review) {
    const slug = (s) => String(s || '').trim().replace(/[^\w-]+/g, '-').replace(/^-+|-+$/g, '');
    return `review_${slug(project.name) || 'project'}_${review.date || 'undated'}.html`;
  }

  return {
    async openPrintView(project, review, settings) {
      const html = await makeDocument(project, review, settings);
      const url = URL.createObjectURL(new Blob([html], { type: 'text/html' }));
      window.open(url, '_blank');
    },
    async download(project, review, settings) {
      const html = await makeDocument(project, review, settings);
      const url = URL.createObjectURL(new Blob([html], { type: 'text/html' }));
      const a = document.createElement('a');
      a.href = url;
      a.download = filename(project, review);
      document.body.appendChild(a);
      a.click();
      a.remove();
    },
    /* HTML string for the in-app read-only preview (rendered inside an iframe). */
    async previewHtml(project, review, settings) {
      return makeDocument(project, review, settings, { embedded: true });
    },
    _buildHtml: buildHtml, // exposed for testing
  };
})();

/* Main app: hash routing, views, autosave. */
(() => {
  const view = document.getElementById('view');
  const screenTitle = document.getElementById('screenTitle');
  const backBtn = document.getElementById('backBtn');
  const settingsBtn = document.getElementById('settingsBtn');
  const toastEl = document.getElementById('toast');

  const esc = (s) =>
    String(s ?? '').replace(/[&<>"']/g, (c) => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
    }[c]));

  const uid = () =>
    (crypto.randomUUID ? crypto.randomUUID() : Date.now() + '-' + Math.random().toString(16).slice(2));

  const today = () => new Date().toISOString().slice(0, 10);

  const STATUS = [
    ['active', 'Active'],
    ['onhold', 'On hold'],
    ['complete', 'Complete'],
  ];
  const statusLabel = (v) => (STATUS.find(([k]) => k === v) || [])[1] || v || '';

  let toastTimer = null;
  function toast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.remove('hidden');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toastEl.classList.add('hidden'), 2600);
  }

  function setHeader(title, backHash) {
    screenTitle.textContent = title;
    backBtn.classList.toggle('hidden', !backHash);
    backBtn.onclick = backHash ? () => (location.hash = backHash) : null;
  }

  settingsBtn.onclick = () => (location.hash = '#/settings');

  /* ---------- routing ---------- */

  let listFilter = { search: '', status: 'all' };
  let reviewFilter = { search: '' };
  // Set by the review editor so a pending debounced save is flushed (while its
  // DOM still exists) before we navigate to another screen.
  let flushPending = null;

  /* Segmented control shown on the two home screens (Projects / Reviews). */
  function homeTabs(active) {
    return `
      <div class="tabs">
        <a class="tab ${active === 'projects' ? 'active' : ''}" href="#/projects">Projects</a>
        <a class="tab ${active === 'reviews' ? 'active' : ''}" href="#/reviews">Saved reviews</a>
      </div>`;
  }

  async function route() {
    stopDictation();
    // Persist any not-yet-saved editor changes before the current view is torn down.
    if (flushPending) {
      const f = flushPending;
      flushPending = null;
      try { await f(); } catch (_) { /* view already gone */ }
    }
    const hash = location.hash || '#/projects';
    const parts = hash.replace(/^#\//, '').split('/');
    try {
      if (parts[0] === 'projects' || parts[0] === '') await viewProjects();
      else if (parts[0] === 'reviews') await viewReviews();
      else if (parts[0] === 'review-view') await viewReviewPreview(parts[1]);
      else if (parts[0] === 'project-edit') await viewProjectForm(parts[1]);
      else if (parts[0] === 'project') await viewProject(parts[1]);
      else if (parts[0] === 'review') await viewReview(parts[1], parts[2]);
      else if (parts[0] === 'settings') await viewSettings();
      else await viewProjects();
    } catch (err) {
      console.error(err);
      view.innerHTML = `<div class="card"><p>Something went wrong loading this screen.</p>
        <p class="muted">${esc(err.message || err)}</p></div>`;
    }
  }
  window.addEventListener('hashchange', route);
  window.addEventListener('DOMContentLoaded', route);

  /* ---------- projects list ---------- */

  async function viewProjects() {
    setHeader('Projects', null);
    const projects = await DB.getAll('projects');
    const reviews = await DB.getAll('reviews');
    const counts = {};
    for (const r of reviews) counts[r.projectId] = (counts[r.projectId] || 0) + 1;

    projects.sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0));

    view.innerHTML = `
      ${homeTabs('projects')}
      <div class="toolbar">
        <input id="searchBox" type="search" placeholder="Search projects…" value="${esc(listFilter.search)}">
        <div class="chips" id="statusChips">
          <button class="chip" data-status="all">All</button>
          ${STATUS.map(([v, l]) => `<button class="chip" data-status="${v}">${l}</button>`).join('')}
        </div>
      </div>
      <div id="projectList" class="list"></div>
      <button id="newProjectBtn" class="btn primary block">+ New project</button>
    `;

    const listEl = document.getElementById('projectList');

    function render() {
      const q = listFilter.search.trim().toLowerCase();
      const filtered = projects.filter((p) => {
        if (listFilter.status !== 'all' && p.status !== listFilter.status) return false;
        if (!q) return true;
        const hay = [p.name, p.aspect, p.ref, p.cadName, p.location, (p.tags || []).join(' ')]
          .join(' ')
          .toLowerCase();
        return hay.includes(q);
      });

      if (!filtered.length) {
        listEl.innerHTML = `<div class="empty">
          ${projects.length ? 'No projects match your filter.' :
            'No projects yet. Tap <strong>New project</strong> to add your first one.'}
        </div>`;
        return;
      }

      listEl.innerHTML = filtered
        .map(
          (p) => `
        <a class="card row-card" href="#/project/${p.id}">
          <div class="row-main">
            <div class="row-title">${esc(p.name)}</div>
            <div class="row-sub">${esc([p.ref, p.aspect].filter(Boolean).join(' · '))}</div>
            <div class="row-sub muted">${esc(p.location || '')}</div>
          </div>
          <div class="row-side">
            <span class="pill pill-${esc(p.status)}">${esc(statusLabel(p.status))}</span>
            <span class="muted small">${counts[p.id] || 0} review${(counts[p.id] || 0) === 1 ? '' : 's'}</span>
          </div>
        </a>`
        )
        .join('');
    }

    document.getElementById('searchBox').addEventListener('input', (e) => {
      listFilter.search = e.target.value;
      render();
    });
    const chips = document.getElementById('statusChips');
    function paintChips() {
      chips.querySelectorAll('.chip').forEach((c) =>
        c.classList.toggle('active', c.dataset.status === listFilter.status)
      );
    }
    chips.addEventListener('click', (e) => {
      const chip = e.target.closest('.chip');
      if (!chip) return;
      listFilter.status = chip.dataset.status;
      paintChips();
      render();
    });
    document.getElementById('newProjectBtn').onclick = () => (location.hash = '#/project-edit');

    paintChips();
    render();
  }

  /* ---------- all-reviews library ---------- */

  function reviewReviewers(r) {
    const list = Array.isArray(r.reviewers) ? r.reviewers : r.reviewer ? [r.reviewer] : [];
    return list.filter(Boolean);
  }

  async function viewReviews() {
    setHeader('Saved reviews', null);
    const [projects, reviews] = [await DB.getAll('projects'), await DB.getAll('reviews')];
    const projectById = {};
    for (const p of projects) projectById[p.id] = p;

    // Most recent first (by review date, then last edited).
    reviews.sort(
      (a, b) => (b.date || '').localeCompare(a.date || '') || (b.updatedAt || 0) - (a.updatedAt || 0)
    );

    view.innerHTML = `
      ${homeTabs('reviews')}
      <div class="toolbar">
        <input id="reviewSearch" type="search" placeholder="Search reviews (project, title, reviewer, date)…"
          value="${esc(reviewFilter.search)}">
      </div>
      <div id="reviewList" class="list"></div>
    `;

    const listEl = document.getElementById('reviewList');

    function render() {
      const q = reviewFilter.search.trim().toLowerCase();
      const filtered = reviews.filter((r) => {
        if (!q) return true;
        const project = projectById[r.projectId];
        const hay = [
          project && project.name,
          project && project.ref,
          r.title,
          r.date,
          reviewReviewers(r).join(' '),
        ]
          .join(' ')
          .toLowerCase();
        return hay.includes(q);
      });

      if (!filtered.length) {
        listEl.innerHTML = `<div class="empty">
          ${reviews.length
            ? 'No reviews match your search.'
            : 'No reviews saved yet. Open a project and tap <strong>New review</strong> to create one — it will appear here automatically.'}
        </div>`;
        return;
      }

      listEl.innerHTML = filtered
        .map((r) => {
          const project = projectById[r.projectId];
          const nSec = (r.sections || []).length;
          const nPh = (r.sections || []).reduce((n, s) => n + (s.photos || []).length, 0);
          const reviewers = reviewReviewers(r).join(', ');
          const projectName = project ? project.name : 'Unknown project';
          const status = project ? project.status : '';
          return `
        <a class="card row-card" href="#/review-view/${r.id}">
          <div class="row-main">
            <div class="row-title">${esc(r.title || 'Review')}</div>
            <div class="row-sub">${esc(projectName)}</div>
            <div class="row-sub muted">${esc(
              [r.date, reviewers, `${nSec} section${nSec === 1 ? '' : 's'}`, `${nPh} photo${nPh === 1 ? '' : 's'}`]
                .filter(Boolean)
                .join(' · ')
            )}</div>
          </div>
          <div class="row-side">
            ${status ? `<span class="pill pill-${esc(status)}">${esc(statusLabel(status))}</span>` : ''}
            <span class="chev">&#8250;</span>
          </div>
        </a>`;
        })
        .join('');
    }

    document.getElementById('reviewSearch').addEventListener('input', (e) => {
      reviewFilter.search = e.target.value;
      render();
    });

    render();
  }

  async function viewReviewPreview(id) {
    const review = await DB.get('reviews', id);
    if (!review) { location.hash = '#/reviews'; return; }
    const project = await DB.get('projects', review.projectId);
    const settings = await DB.getSettings();
    setHeader(project ? project.name : 'Review', '#/reviews');

    view.innerHTML = `

      </div>
    `;

    const frame = document.getElementById('previewFrame');
    const html = await Exporter.previewHtml(project || { name: 'Project' }, review, settings);

    frame.onload = () => {

    setTimeout(() => {

  async function deleteReviewData(review) {
    for (const sec of review.sections || []) {
      for (const ph of sec.photos || []) await DB.delete('photos', ph.id);
    }
    for (const ph of review.nextStepsPhotos || []) await DB.delete('photos', ph.id);
    await DB.delete('reviews', review.id);
  }

  /* ---------- review editor ---------- */

  let dictation = null;        // active dictation instance
  let dictationTarget = null;  // section id currently being dictated into

  function stopDictation() {
    if (dictation && dictation.active) dictation.stop();
    dictation = null;
    dictationTarget = null;
  }

  /* Options for the "add a reviewer" select: team members not already picked. */
  function reviewerAddOptions(people, selected) {
    const available = people.filter((n) => !selected.includes(n));
    return (
      `<option value="">+ Add reviewer…</option>` +
      available.map((n) => `<option value="${esc(n)}">${esc(n)}</option>`).join('') +
      `<option value="__add__">+ Add new person…</option>`
    );
  }

  async function viewReview(id, origin) {
    const review = await DB.get('reviews', id);
    if (!review) { location.hash = '#/projects'; return; }
    const project = await DB.get('projects', review.projectId);
    // Return to wherever the editor was opened from.
    const backHash =
      origin === 'view' ? `#/review-view/${id}`
      : origin === 'lib' ? '#/reviews'
      : `#/project/${review.projectId}`;
    setHeader(project ? project.name : 'Review', backHash);

    const speechSupported = !!(window.SpeechRecognition || window.webkitSpeechRecognition);
    const appSettings = await DB.getSettings();

    // Multiple reviewers per review. Migrate any older single-`reviewer` reviews.
    const reviewers = Array.isArray(review.reviewers)
      ? review.reviewers.slice()
      : review.reviewer ? [review.reviewer] : [];

    view.innerHTML = `
      <div class="card form" id="reviewMeta">
        <div class="grid-2">
          <label>Review title<input id="rvTitle" value="${esc(review.title)}"></label>
          <label>Date<input id="rvDate" type="date" value="${esc(review.date)}"></label>
        </div>
        <div class="field">
          <span class="field-label">Reviewed by</span>
          <div class="chip-list" id="reviewerChips"></div>
          <select id="reviewerAddSel"></select>
        </div>
      </div>

      <h2 class="section-label">Review sections</h2>
      <div id="sections"></div>
      <button id="addSectionBtn" class="btn block">+ Add section</button>

      <h2 class="section-label">Next steps</h2>
      <div class="card" id="nextStepsCard">
        <textarea id="nextSteps" class="sec-notes" rows="4"
          placeholder="Follow-up actions — one per line. Dictate below, then Tidy.">${esc(review.nextSteps || '')}</textarea>
        <div class="dict-bar">
          ${speechSupported ? '<button class="btn small mic-btn" id="nsMic">&#127908; Dictate</button>' : ''}
          <button class="btn small" id="nsTidy">&#10024; Tidy into bullets</button>
          <span class="interim muted small" id="nsInterim"></span>
        </div>
        <div class="photo-row" id="nsPhotoRow"></div>
        <label class="btn small photo-add">&#128247; Add photo
          <input type="file" accept="image/*" capture="environment" multiple hidden>
        </label>
      </div>

      <div class="actions">
        <button id="exportBtn" class="btn primary block">Export review form (PDF / print)</button>
        <button id="downloadBtn" class="btn block">Download as HTML file</button>
        <button id="deleteReviewBtn" class="btn danger block">Delete review</button>
      </div>
      ${speechSupported ? '' : '<p class="muted small">Voice dictation is not supported in this browser — use Chrome, or your keyboard’s mic key.</p>'}
      <p class="muted small" id="saveState">All changes save automatically.</p>
    `;

    const sectionsEl = document.getElementById('sections');

    /* --- persistence --- */
    let saveTimer = null;
    function scheduleSave() {
      clearTimeout(saveTimer);
      saveTimer = setTimeout(save, 400);
    }
    // Flush a pending save before leaving the editor (called from route()).
    flushPending = async () => { clearTimeout(saveTimer); await save(); };
    async function save() {
      // The view may have been torn down before a debounced save fired.
      const titleEl = document.getElementById('rvTitle');
      if (!titleEl) return;
      review.title = titleEl.value;
      review.date = document.getElementById('rvDate').value;
      review.reviewers = reviewers.slice();
      delete review.reviewer; // superseded by the reviewers array
      review.nextSteps = document.getElementById('nextSteps').value;
      const nsRow = document.getElementById('nsPhotoRow');
      review.nextStepsPhotos = nsRow
        ? [...nsRow.querySelectorAll('.photo-thumb')].map((t) => ({
            id: t.dataset.photoId,
            caption: t.querySelector('.photo-caption').value,
          }))
        : review.nextStepsPhotos || [];
      review.sections = [...sectionsEl.querySelectorAll('.section-card')].map((el) => {
        const secId = el.dataset.id;
        const old = review.sections.find((s) => s.id === secId) || { photos: [] };
        return {
          id: secId,
          title: el.querySelector('.sec-title').value,
          notes: el.querySelector('.sec-notes').value,
          photos: [...el.querySelectorAll('.photo-thumb')].map((t) => ({
            id: t.dataset.photoId,
            caption: t.querySelector('.photo-caption').value,
          })),
        };
      });
      review.updatedAt = Date.now();
      await DB.put('reviews', review);
      if (project) { project.updatedAt = Date.now(); await DB.put('projects', project); }
      const st = document.getElementById('saveState');
      if (st) st.textContent = 'Saved ' + new Date().toLocaleTimeString();
    }

    document.getElementById('reviewMeta').addEventListener('input', scheduleSave);
    sectionsEl.addEventListener('input', scheduleSave);

    /* Shared Dictate/Tidy wiring, used by review sections and the Next steps field.
     * targetKey uniquely identifies the field being dictated into so only one
     * mic records at a time. */
    function wireDictation(micBtn, interimEl, notesEl, targetKey) {
      if (!micBtn) return;
      micBtn.onclick = () => {
        if (dictationTarget === targetKey) {
          stopDictation();
          micBtn.classList.remove('recording');
          micBtn.innerHTML = '&#127908; Dictate';
          return;
        }
        stopDictation();
        document.querySelectorAll('.mic-btn.recording').forEach((b) => {
          b.classList.remove('recording');
          b.innerHTML = '&#127908; Dictate';
        });
        dictationTarget = targetKey;
        // Whatever is already in the field; dictation is appended to it as one
        // continuous stream (spaces, not a new line per word).
        const base = notesEl.value;
        dictation = createDictation({
          onTranscript: (finalized, interim) => {
            const dictated = (finalized + interim).replace(/\s+/g, ' ').trim();
            notesEl.value = base
              ? base.replace(/\s*$/, '') + (dictated ? ' ' + dictated : '')
              : dictated;
            interimEl.textContent = interim.replace(/\s+/g, ' ').trim();
            scheduleSave();
          },
          onState: (active) => {
            micBtn.classList.toggle('recording', active);
            micBtn.innerHTML = active ? '&#9632; Stop' : '&#127908; Dictate';
            if (!active) interimEl.textContent = '';
          },
          onError: (msg) => toast(msg),
        });
        if (dictation) dictation.start();
      };
    }

    function wireTidy(tidyBtn, notesEl) {
      tidyBtn.onclick = async (e) => {
        const btn = e.currentTarget;
        const raw = notesEl.value.trim();
        if (!raw) { toast('Nothing to tidy yet'); return; }
        const settings = await DB.getSettings();
        let bullets;
        if (settings.aiEnabled && settings.apiKey) {
          btn.disabled = true;
          btn.textContent = 'Tidying…';
          try {
            bullets = await Tidy.ai(raw, settings.apiKey);
          } catch (err) {
            toast('AI tidy failed (' + err.message + ') — used offline tidy instead');
            bullets = Tidy.local(raw);
          }
          btn.disabled = false;
          btn.innerHTML = '&#10024; Tidy into bullets';
        } else {
          bullets = Tidy.local(raw);
        }
        if (!bullets.length) { toast('Nothing usable found'); return; }
        notesEl.value = bullets.join('\n');
        scheduleSave();
      };
    }

    /* Next steps field: same Dictate/Tidy affordances as sections. */
    const nextStepsEl = document.getElementById('nextSteps');
    nextStepsEl.addEventListener('input', scheduleSave);
    wireDictation(document.getElementById('nsMic'), document.getElementById('nsInterim'), nextStepsEl, '__nextsteps__');
    wireTidy(document.getElementById('nsTidy'), nextStepsEl);

    /* "Reviewed by" — multiple reviewers as chips, plus NPI team + add-new-person */
    const reviewerChips = document.getElementById('reviewerChips');
    const reviewerAddSel = document.getElementById('reviewerAddSel');

    function renderReviewerChips() {
      reviewerChips.innerHTML = reviewers.length
        ? reviewers
            .map(
              (n, i) => `<span class="chip reviewer-chip">${esc(n)}
                <button type="button" class="chip-remove" data-i="${i}" aria-label="Remove ${esc(n)}">&#10005;</button>
              </span>`
            )
            .join('')
        : '<span class="muted small">No reviewers added yet.</span>';
      reviewerChips.querySelectorAll('.chip-remove').forEach((btn) => {
        btn.onclick = () => {
          reviewers.splice(Number(btn.dataset.i), 1);
          renderReviewerChips();
          renderReviewerAddSelect();
          scheduleSave();
        };
      });
    }
    function renderReviewerAddSelect() {
      reviewerAddSel.innerHTML = reviewerAddOptions(appSettings.people, reviewers);
    }

    reviewerAddSel.addEventListener('change', async () => {
      const val = reviewerAddSel.value;
      if (!val) return;
      if (val === '__add__') {
        const name = (prompt('Name of new reviewer:') || '').trim();
        if (name) {
          if (!appSettings.people.includes(name)) {
            appSettings.people.push(name);
            await DB.saveSettings(appSettings);
          }
          if (!reviewers.includes(name)) reviewers.push(name);
          toast(name + ' added to the team list');
        }
      } else if (!reviewers.includes(val)) {
        reviewers.push(val);
      }
      renderReviewerChips();
      renderReviewerAddSelect();
      scheduleSave();
    });

    renderReviewerChips();
    renderReviewerAddSelect();

    /* --- shared photo handling (sections + next steps) --- */

    const displayBlob = (rec) => rec.annotatedBlob || rec.blob;

    async function openAnnotator(rec, imgEl) {
      const result = await PhotoEditor.open(rec.blob, rec.annotations || []);
      if (!result) return; // cancelled
      rec.annotations = result.annotations;
      if (result.annotatedBlob) rec.annotatedBlob = result.annotatedBlob;
      else delete rec.annotatedBlob;
      await DB.put('photos', rec);
      imgEl.src = URL.createObjectURL(displayBlob(rec));
      await save();
      toast(result.annotations.length ? 'Annotations saved' : 'Annotations cleared');
    }

    function buildPhotoThumb(rec, caption) {
      const t = document.createElement('div');
      t.className = 'photo-thumb';
      t.dataset.photoId = rec.id;
      t.innerHTML = `
        <img src="${URL.createObjectURL(displayBlob(rec))}" alt="Review photo">
        <div class="thumb-btns">
          <button class="thumb-edit" title="Annotate photo">&#9998;</button>
          <button class="thumb-del" title="Remove photo">&#10005;</button>
        </div>
        <input class="photo-caption" placeholder="Caption…" value="${esc(caption || '')}">
      `;
      t.querySelector('.thumb-edit').onclick = () => openAnnotator(rec, t.querySelector('img'));
      t.querySelector('.thumb-del').onclick = async () => {
        if (!confirm('Remove this photo?')) return;
        await DB.delete('photos', rec.id);
        t.remove();
        await save();
      };
      return t;
    }

    async function loadPhotoThumbs(photoRow, refs) {
      for (const ph of refs || []) {
        const rec = await DB.get('photos', ph.id);
        if (rec) photoRow.appendChild(buildPhotoThumb(rec, ph.caption));
      }
    }

    function wirePhotoAdd(inputEl, photoRow) {
      if (!inputEl) return;
      inputEl.addEventListener('change', async (e) => {
        const files = [...e.target.files];
        e.target.value = '';
        for (const file of files) {
          try {
            const blob = await downscalePhoto(file);
            const rec = { id: uid(), blob, annotations: [], createdAt: Date.now() };
            await DB.put('photos', rec);
            photoRow.appendChild(buildPhotoThumb(rec, ''));
          } catch (err) {
            console.error(err);
            toast('Could not add that photo');
          }
        }
        await save();
      });
    }

    /* Next steps photos */
    const nsPhotoRow = document.getElementById('nsPhotoRow');
    await loadPhotoThumbs(nsPhotoRow, review.nextStepsPhotos || []);
    wirePhotoAdd(document.querySelector('#nextStepsCard .photo-add input'), nsPhotoRow);

    /* --- section rendering --- */
    async function renderSections() {
      sectionsEl.innerHTML = '';
      for (const sec of review.sections) sectionsEl.appendChild(await buildSectionEl(sec));
    }

    async function buildSectionEl(sec) {
      const el = document.createElement('div');
      el.className = 'card section-card';
      el.dataset.id = sec.id;
      el.innerHTML = `
        <div class="section-head">
          <input class="sec-title" placeholder="Section title (e.g. Progress, Budget, Quality)" value="${esc(sec.title)}">
          <button class="icon-btn sec-up" title="Move up">&#8593;</button>
          <button class="icon-btn sec-down" title="Move down">&#8595;</button>
          <button class="icon-btn sec-del" title="Delete section">&#10005;</button>
        </div>
        <textarea class="sec-notes" rows="4"
          placeholder="Notes — one point per line. Dictate below, then Tidy.">${esc(sec.notes)}</textarea>
        <div class="dict-bar">
          ${speechSupported ? '<button class="btn small mic-btn">&#127908; Dictate</button>' : ''}
          <button class="btn small tidy-btn">&#10024; Tidy into bullets</button>
          <span class="interim muted small"></span>
        </div>
        <div class="photo-row"></div>
        <label class="btn small photo-add">&#128247; Add photo
          <input type="file" accept="image/*" capture="environment" multiple hidden>
        </label>
      `;

      const photoRow = el.querySelector('.photo-row');
      await loadPhotoThumbs(photoRow, sec.photos);

      /* section controls */
      el.querySelector('.sec-del').onclick = async () => {
        if (!confirm('Delete this section (and its photos)?')) return;
        const cur = review.sections.find((s) => s.id === sec.id);
        for (const ph of (cur && cur.photos) || []) await DB.delete('photos', ph.id);
        el.remove();
        await save();
      };
      el.querySelector('.sec-up').onclick = async () => {
        if (el.previousElementSibling) { el.parentNode.insertBefore(el, el.previousElementSibling); await save(); }
      };
      el.querySelector('.sec-down').onclick = async () => {
        if (el.nextElementSibling) { el.parentNode.insertBefore(el.nextElementSibling, el); await save(); }
      };

      /* dictation + tidy (shared helpers) */
      const notesEl = el.querySelector('.sec-notes');
      wireDictation(el.querySelector('.mic-btn'), el.querySelector('.interim'), notesEl, sec.id);
      wireTidy(el.querySelector('.tidy-btn'), notesEl);

      /* photos (shared helper) */
      wirePhotoAdd(el.querySelector('.photo-add input'), photoRow);

      return el;
    }

    document.getElementById('addSectionBtn').onclick = async () => {
      const sec = { id: uid(), title: '', notes: '', photos: [] };
      review.sections.push(sec);
      sectionsEl.appendChild(await buildSectionEl(sec));
      await save();
      sectionsEl.lastElementChild.querySelector('.sec-title').focus();
    };

    document.getElementById('exportBtn').onclick = async () => {
      await save();
      const settings = await DB.getSettings();
      await Exporter.openPrintView(project || { name: 'Project' }, review, settings);
    };
    document.getElementById('downloadBtn').onclick = async () => {
      await save();
      const settings = await DB.getSettings();
      await Exporter.download(project || { name: 'Project' }, review, settings);
      toast('Review form downloaded');
    };
    document.getElementById('deleteReviewBtn').onclick = async () => {
      if (!confirm('Delete this review and its photos?')) return;
      await deleteReviewData(review);
      toast('Review deleted');
      location.hash = backHash;
    };

    await renderSections();
  }

  /* Downscale camera photos before storing (max 1600px, JPEG). */
  async function downscalePhoto(file) {
    const img = await createImageBitmap(file, { imageOrientation: 'from-image' });
    const MAX = 1600;
    const scale = Math.min(1, MAX / Math.max(img.width, img.height));
    const w = Math.max(1, Math.round(img.width * scale));
    const h = Math.max(1, Math.round(img.height * scale));
    const canvas = document.createElement('canvas');
    canvas.width = w;
    canvas.height = h;
    canvas.getContext('2d').drawImage(img, 0, 0, w, h);
    const blob = await new Promise((res) => canvas.toBlob(res, 'image/jpeg', 0.82));
    if (!blob) throw new Error('encode failed');
    return blob;
  }

  /* ---------- settings ---------- */

  async function viewSettings() {
    setHeader('Settings', '#/projects');
    const s = await DB.getSettings();

    // This app's own URL (without the in-app #route) — for sharing / installing elsewhere.
    const appUrl = location.origin + location.pathname;

    view.innerHTML = `
      <form id="settingsForm" class="card form">
        <label>Your name (default reviewer)<input name="reviewer" value="${esc(s.reviewer)}"></label>
        <label>Company name (shown on review forms)<input name="company" value="${esc(s.company)}"></label>

        <h3 class="settings-sub">AI-powered tidy (optional)</h3>
        <p class="muted small">Off = the built-in offline tidy is used. On = dictation is cleaned up by
        Claude using your own Anthropic API key. The key is stored only on this device and sent only to
        Anthropic. Get a key at console.anthropic.com — use one with a spend limit.</p>
        <label class="check"><input type="checkbox" name="aiEnabled" ${s.aiEnabled ? 'checked' : ''}> Use AI tidy</label>
        <label>Anthropic API key<input name="apiKey" type="password" autocomplete="off" value="${esc(s.apiKey)}"></label>

        <button class="btn primary block" type="submit">Save settings</button>
      </form>

      <div class="card">
        <h3 class="settings-sub" style="margin-top:0">App link</h3>
        <p class="muted small">Open this app on another device, or share it with a colleague.</p>
        <a class="app-link" id="appLink" href="${esc(appUrl)}" target="_blank" rel="noopener">${esc(appUrl)}</a>
        <div class="link-actions">
          <button type="button" class="btn small" id="copyLinkBtn">Copy link</button>
          <a class="btn small" href="${esc(appUrl)}" target="_blank" rel="noopener">Open in new tab</a>
        </div>
      </div>

      <p class="muted small center">All data is stored locally on this device.<br>
      Install this app: browser menu &rarr; “Add to Home Screen”.</p>
    `;

    document.getElementById('copyLinkBtn').onclick = async () => {
      try {
        await navigator.clipboard.writeText(appUrl);
        toast('Link copied');
      } catch (_) {
        // Clipboard API unavailable (e.g. non-secure context) — select the text instead.
        const range = document.createRange();
        range.selectNodeContents(document.getElementById('appLink'));
        const sel = window.getSelection();
        sel.removeAllRanges();
        sel.addRange(range);
        toast('Copy the highlighted link');
      }
    };

    document.getElementById('settingsForm').onsubmit = async (e) => {
      e.preventDefault();
      const f = new FormData(e.target);
      const current = await DB.getSettings();
      await DB.saveSettings(Object.assign(current, {
        reviewer: String(f.get('reviewer')).trim(),
        company: String(f.get('company')).trim(),
        aiEnabled: f.get('aiEnabled') === 'on',
        apiKey: String(f.get('apiKey')).trim(),
      }));
      toast('Settings saved');
      location.hash = '#/projects';
    };
  }
})();

</script>
