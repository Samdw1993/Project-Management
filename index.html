<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1d3557">
  <meta name="description" content="Standardised project review capture and export — camera, dictation, tidy notes.">
  <title>Project Review</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
</head>
<body>
  <header class="app-header">
    <button id="backBtn" class="icon-btn hidden" aria-label="Back">&#8592;</button>
    <h1 id="screenTitle">Projects</h1>
    <button id="settingsBtn" class="icon-btn" aria-label="Settings">&#9881;</button>
  </header>

  <main id="view" class="view"></main>

  <div id="toast" class="toast hidden"></div>

  <script src="js/db.js"></script>
  <script src="js/tidy.js"></script>
  <script src="js/dictation.js"></script>
  <script src="js/export.js"></script>
  <script src="js/app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(() => {});
      });
    }
  </script>
</body>
</html>
